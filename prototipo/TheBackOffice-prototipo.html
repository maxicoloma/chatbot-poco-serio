    if (S.onb === 1) {
      body = `<p class="muted">Con esto armamos tu cuenta. Puedes cambiarlo después en «Empresa».</p>${errSummary()}
        <div class="sec">${empresaFields('empresa', false)}</div>`;
    } else if (S.onb === 2) {
      const team = S.people.filter(p => !p.owner);
      body = `<p class="muted">Agrega a las personas que hacen tareas administrativas. Si alguien no está, sus tareas pasan a su reemplazo.</p>
        ${uploader('colab')}${errSummary()}
        <div class="sec-h"><h3>Colaboradores</h3><small>${team.length} agregado${team.length === 1 ? '' : 's'}</small></div>
        ${team.length ? team.map((p, i) => `<div class="card"><div class="task-top"><span class="folio">Colaborador ${i + 1}</span><button class="linkbtn" data-act="del-person" data-id="${p.id}">Quitar</button></div>${personFields('people.' + p.id, p)}</div>`).join('')
          : `<div class="list"><div class="empty">${S.asistida.colab ? `Cargaremos tu equipo desde ${esc(S.asistida.colab)}. También puedes agregarlo a mano.` : 'Aún no agregas colaboradores. Agrega al menos uno o sube un archivo.'}</div></div>`}
        ${S.errs['team'] ? `<div class="err">${esc(S.errs['team'])}</div>` : ''}
        <button class="btn" data-act="add-person-inline">+ Agregar colaborador</button>`;
    } else {
      body = `<p class="muted">Define las tareas de tu empresa y, para cada una, la pauta: lo que debe cumplirse antes de cerrarla. Después puedes agregar más.</p>
        ${errSummary()}
        <div class="card">${limitField('empresa')}</div>
        ${uploader('tareas')}
        <div class="sec-h"><h3>Tareas</h3><small>${S.tasks.length} definida${S.tasks.length === 1 ? '' : 's'}</small></div>
        ${S.tasks.length ? `<div class="list">${S.tasks.map(t => {
          const inc = taskIncomplete(t);
          return `<div class="lrow" style="grid-template-columns:22px 1fr auto"><span class="tick ${inc ? 'bad' : 'ok'}">${inc ? '!' : '✓'}</span>
            <span class="t">${esc(t.nombre || 'Tarea sin nombre')}<small>${esc(nameOf(t.responsable))} · ${t.pauta.length} punto${t.pauta.length === 1 ? '' : 's'}${t.monto ? ' · ' + fmt(t.monto) : ''}</small>${inc ? '<small class="flag">Faltan datos obligatorios</small>' : ''}</span>
            <span class="rowbtns"><button class="linkbtn" data-act="edit-task" data-id="${t.id}">${inc ? 'Completar' : 'Editar'}</button><button class="x" data-act="del-task-now" data-id="${t.id}" aria-label="Quitar tarea">×</button></span></div>`;
        }).join('')}</div>` : `<div class="list"><div class="empty">${S.asistida.tareas ? `Cargaremos tus tareas desde ${esc(S.asistida.tareas)}. También puedes agregarlas a mano.` : 'Aún no defines tareas. Agrega al menos una o sube un archivo.'}</div></div>`}
        ${S.errs['tasks'] ? `<div class="err">${esc(S.errs['tasks'])}</div>` : ''}
        <button class="btn" data-act="new-task">+ Agregar tarea</button>`;
    }
    return `${prog}${body}<p class="formnote"><span class="req">*</span> Obligatorio. No puedes pasar a la siguiente fase sin completarlos.</p>
      <div class="btns">${S.onb > 1 ? '<button class="btn ghost" data-act="onb-prev">Atrás</button>' : ''}
        <button class="btn primary" data-act="onb-next">${S.onb < 3 ? 'Siguiente' : 'Ir a mi panel'}</button></div>`;
  }

  function valOnb(step) {
    if (step === 1) return valEmpresa('empresa', false);
    if (step === 2) {
      const e = {}; const team = S.people.filter(p => !p.owner);
      if (!team.length && !S.asistida.colab) e.team = 'Agrega al menos un colaborador o sube un archivo con tu equipo.';
      team.forEach(p => Object.assign(e, valPerson('people.' + p.id)));
      return e;
    }
    const e = valLimit('empresa');
    if (!S.tasks.length && !S.asistida.tareas) e.tasks = 'Agrega al menos una tarea o sube un archivo con tus tareas.';
    const bad = S.tasks.filter(taskIncomplete);
    if (bad.length) e.tasks = `${bad.length} tarea${bad.length > 1 ? 's tienen' : ' tiene'} datos obligatorios sin completar. Toca «Completar».`;
    return e;
  }

  /* ---------- editor de tarea (alta y edición) ---------- */
  function vEditor() {
    const t = S.edit; if (!t) return '<p>No hay una tarea abierta.</p>';
    const kinds = [['check', 'Marcar como cumplido'], ['foto', 'Adjuntar foto o archivo'], ['numero', 'Registrar una cantidad']];
    return `<button class="back" data-act="back">‹ Volver</button>${errSummary()}
      <div class="sec">
        ${F('edit.nombre', 'Nombre de la tarea', { req: true, ph: 'Ej: Recepción de mercadería, cierre de caja' })}
        ${F('edit.responsable', 'Quién la hace', { req: true, opts: [['', 'Elige una persona'], ...S.people.map(p => [p.id, `${p.nombre || 'Sin nombre'}${p.cargo ? ' · ' + p.cargo : ''}`])] })}
        <div class="grid2">${F('edit.monto', 'Monto (CLP)', { im: 'numeric', ph: 'Ej: 150000' })}${F('edit.frecuencia', 'Frecuencia', { ph: 'Ej: diaria, cada lunes' })}</div>
        ${F('edit.descripcion', 'Instrucciones para quien la hace', { area: true, ph: 'Ej: revisar contra la orden de compra impresa' })}
      </div>
      <div class="card"><div class="sec-h"><h3>Pauta <span class="req">*</span></h3><small>${t.pauta.length} punto${t.pauta.length === 1 ? '' : 's'}</small></div>
        <p class="small muted">Lo que debe cumplirse antes de cerrar la tarea. Si algo no calza, vuelve a quien la hizo.</p>
        ${t.pauta.map((p, i) => `<div class="point"><div class="sec" style="gap:8px">
            <span class="point-n">Punto ${i + 1}</span>
            ${F(`edit.pauta.${i}.t`, 'Qué se revisa', { req: true, ph: 'Ej: la factura está registrada' })}
            ${F(`edit.pauta.${i}.k`, 'Cómo se comprueba', { req: true, re: true, opts: kinds })}
            ${p.k === 'numero' ? F(`edit.pauta.${i}.esperado`, 'Cantidad esperada', { im: 'decimal', ph: 'Ej: 24', hint: 'Si la registrada es distinta, la tarea vuelve al equipo.' }) : ''}
          </div>${t.pauta.length > 1 ? `<button class="x" data-act="del-point" data-i="${i}" aria-label="Quitar punto ${i + 1}">×</button>` : '<span></span>'}</div>`).join('')}
        ${S.errs['edit.pauta'] ? `<span class="err">${esc(S.errs['edit.pauta'])}</span>` : ''}
        <button class="btn sm" data-act="add-point">+ Agregar punto</button>
      </div>
      <div class="card"><div class="toggle-row"><span>Siempre pasa por mí<span class="small muted" style="display:block">Aunque cumpla la pauta y el monto sea bajo. Útil para pagos, impuestos o temas legales.</span></span>
        <button class="switch" role="switch" aria-label="Siempre pasa por mí" aria-checked="${!!t.siempre}" data-act="edit-siempre"></button></div></div>
      <p class="formnote"><span class="req">*</span> Obligatorio</p>
      <div class="btns"><button class="btn ghost" data-act="back">Cancelar</button><button class="btn primary" data-act="save-task">${t.id ? 'Guardar cambios' : 'Agregar tarea'}</button></div>`;
  }

  /* ---------- panel del dueño: muestra TODAS las tareas ---------- */
  function taskCard(t, actions) {
    const e = ESTADO[t.estado];
    const okN = (t.checks || []).filter(c => c.ok).length;
    return `<div class="card ${e.c === 'warn' ? 'warn' : e.c === 'bad' ? 'bad' : ''}">
      <div class="task-top"><div><div class="folio">${t.id}${t.frecuencia ? ' · ' + esc(t.frecuencia) : ''}</div><div class="task-title">${esc(t.nombre)}</div></div><div class="amount">${t.monto ? fmt(t.monto) : ''}</div></div>
      <div class="meta"><span>${esc(nameOf(t.responsable))}</span><span>Pauta ${t.checks ? okN + '/' : ''}${t.pauta.length}</span></div>
      ${t.motivo ? `<div class="reason ${e.c}">${esc(t.motivo)}</div>` : ''}
      <div class="btns">${actions ? `<button class="btn okb sm" data-act="approve" data-id="${t.id}">Aprobar</button>` : ''}<button class="btn sm${actions ? '' : ' ghost'}" data-act="open" data-id="${t.id}">Ver detalle</button></div></div>`;
  }
  function lrow(t, sub) {
    const e = ESTADO[t.estado]; const inc = taskIncomplete(t);
    return `<button class="lrow" data-act="open" data-id="${t.id}"><span class="tick ${inc ? 'bad' : e.c}">${inc ? '!' : e.mark}</span>
      <span class="t">${esc(t.nombre || 'Tarea sin nombre')}<small>${t.id} · ${esc(sub ?? nameOf(t.responsable))}${t.cierre === 'dueño' ? ' · aprobada por ti' : ''}</small>${inc ? '<small class="flag">Faltan datos: toca para completar</small>' : ''}</span>
      <span class="amount" style="font-size:13px">${t.monto ? fmt(t.monto) : ''}</span></button>`;
  }
  function absentBanner() {
    return S.people.filter(p => !p.disponible && !p.owner).map(p => `<div class="banner info"><span><b>${esc(p.nombre)} no está disponible hoy.</b> Sus tareas pasaron a ${esc(p.reemplazo ? first(p.reemplazo) : first(owner().id))}.</span></div>`).join('');
  }
  function section(title, note, list, render) {
    return `<section class="sec"><div class="sec-h"><h3>${title} · ${list.length}</h3><small>${note}</small></div>
      ${list.length ? render(list) : `<div class="list"><div class="empty">Ninguna.</div></div>`}</section>`;
  }

  function vPanel() {
    const by = e => S.tasks.filter(t => t.estado === e);
    const ap = by('aprobacion'), dv = by('devuelta'), pe = by('pendiente'), cl = by('cerrada');
    const solas = cl.filter(t => t.cierre === 'pauta').length;
    const pend = S.asistida.colab || S.asistida.tareas;
    return `<div class="totalline"><b>${S.tasks.length} tarea${S.tasks.length === 1 ? '' : 's'} en tu panel</b><button class="btn sm primary" style="flex:none" data-act="new-task">+ Nueva tarea</button></div>
      <div class="kpis four">
        <button class="kpi idle" data-act="filter" data-f="pendiente"><span class="n">${pe.length}</span><span class="l">Por hacer</span></button>
        <button class="kpi warn" data-act="filter" data-f="aprobacion"><span class="n">${ap.length}</span><span class="l">Esperan tu aprobación</span></button>
        <button class="kpi bad" data-act="filter" data-f="devuelta"><span class="n">${dv.length}</span><span class="l">Devueltas</span></button>
        <button class="kpi ok" data-act="filter" data-f="cerrada"><span class="n">${cl.length}</span><span class="l">Cerradas</span></button>
      </div>
      ${pend ? `<div class="banner info"><span><b>Carga asistida en curso.</b> Estamos cargando ${[S.asistida.colab, S.asistida.tareas].filter(Boolean).map(esc).join(' y ')}. Mientras, puedes agregar tareas a mano.</span></div>` : ''}
      ${absentBanner()}
      ${!S.tasks.length ? `<div class="list"><div class="empty">Tu panel está vacío. Agrega tu primera tarea con «+ Nueva tarea».</div></div>` : ''}
      ${section('Esperan tu aprobación', 'sobre tu límite o críticas', ap, l => l.map(t => taskCard(t, true)).join(''))}
      ${section('Devueltas al equipo', 'no pasaron la pauta', dv, l => `<div class="list">${l.map(t => lrow(t, `${nameOf(t.responsable)} · ${t.motivo}`)).join('')}</div>`)}
      ${section('Por hacer', 'en manos del equipo', pe, l => `<div class="list">${l.map(t => lrow(t)).join('')}</div>`)}
      <div class="cta"><h3>¿Lo probamos con una tarea real de tu empresa?</h3><p>Nos compartes una tarea y su pauta. La dejamos funcionando con tu equipo.</p>
        <button class="btn" data-act="go" data-to="probar">Quiero probarlo</button></div>
      ${section('Cerradas', `${solas} sin pasar por ti`, cl, l => `<div class="list">${l.map(t => lrow(t)).join('')}</div>`)}`;
  }

  function vTareas() {
    const f = S.filter;
    const filters = [['todas', 'Todas'], ['pendiente', 'Por hacer'], ['aprobacion', 'Esperan aprobación'], ['devuelta', 'Devueltas'], ['cerrada', 'Cerradas']];
    const list = S.tasks.filter(t => f === 'todas' || t.estado === f);
    return `<div class="totalline"><b>${S.tasks.length} tarea${S.tasks.length === 1 ? '' : 's'}</b><button class="btn sm primary" style="flex:none" data-act="new-task">+ Nueva tarea</button></div>
      <div class="filterwrap"><button class="fbtn l" data-act="fscroll" data-d="-1" aria-label="Ver filtros anteriores" tabindex="-1">‹</button>
        <div class="filters" id="filters" role="group" aria-label="Filtrar tareas (desliza para ver más)">${filters.map(([k, l]) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${f === k}">${l} <span class="mono">${k === 'todas' ? S.tasks.length : count(k)}</span></button>`).join('')}</div>
        <button class="fbtn r" data-act="fscroll" data-d="1" aria-label="Ver más filtros" tabindex="-1">›</button></div>
      ${list.length ? `<div class="list">${list.map(t => lrow(t)).join('')}</div>` : '<div class="list"><div class="empty">No hay tareas en este estado.</div></div>'}
      <p class="small muted">Toca una tarea para editarla, cambiar su pauta o quitarla.</p>
      ${uploader('tareas')}`;
  }

  function checksBlock(t) {
    const items = t.checks || t.pauta.map(p => ({ t: p.t, k: p.k, ok: null, esperado: p.esperado }));
    return `<div class="card"><div class="sec-h"><h3>Pauta</h3><small>${items.length} punto${items.length === 1 ? '' : 's'}</small></div>
      <div class="checks">${items.map(c => {
        const cls = c.ok === true ? 'ok' : c.ok === false ? 'bad' : 'idle';
        const extra = c.k === 'numero' ? `<small style="color:var(--muted)">${c.valor !== undefined && c.valor !== '' ? 'Registrado: ' + esc(c.valor) + ' · ' : ''}${!blank(c.esperado) ? 'Esperado: ' + esc(c.esperado) : 'Cantidad libre'}</small>` : c.k === 'foto' ? `<small style="color:var(--muted)">${c.archivo ? esc(c.archivo) : 'Requiere foto o archivo'}</small>` : '';
        return `<div class="check"><span class="tick ${cls}">${c.ok === true ? '✓' : c.ok === false ? '×' : '·'}</span><span>${esc(c.t)}${extra}${c.ok === false && c.detalle ? `<small>${esc(c.detalle)}</small>` : ''}</span></div>`;
      }).join('')}</div></div>`;
  }

  function vTarea() {
    const t = task(S.param); if (!t) return '<p>No encontramos la tarea.</p>';
    const e = ESTADO[t.estado];
    const others = S.people.filter(p => p.id !== t.responsable);
    const reassign = `<div class="field"><label for="f-re">Pasar la tarea a</label><select id="f-re">${others.map(p => `<option value="${p.id}">${esc(p.nombre)}${p.disponible ? '' : ' (no disponible)'}</option>`).join('')}</select></div>
      <div class="btns"><button class="btn ghost" data-act="ui" data-k="reassign" data-v="">Cancelar</button><button class="btn primary" data-act="reassign" data-id="${t.id}">Reasignar</button></div>`;
    let decide = '';
    if (t.estado === 'aprobacion' || t.estado === 'devuelta') {
      decide = `<div class="card"><div class="sec-h"><h3>Tu decisión</h3></div>
        ${S.ui.reject ? `<div class="field"><label for="f-rej">¿Qué debe corregir ${esc(first(t.responsable))}?</label><textarea id="f-rej" placeholder="Ej: pedir nueva cotización, el precio subió"></textarea></div>
          <div class="btns"><button class="btn ghost" data-act="ui" data-k="reject" data-v="">Cancelar</button><button class="btn badb" data-act="reject" data-id="${t.id}">Devolver con comentario</button></div>`
        : S.ui.reassign ? reassign
        : `<div class="btns"><button class="btn okb" data-act="approve" data-id="${t.id}">${t.estado === 'devuelta' ? 'Aprobar igual' : 'Aprobar'}</button>
            ${t.estado === 'aprobacion' ? '<button class="btn badb" data-act="ui" data-k="reject" data-v="1">Devolver</button>' : ''}
            <button class="btn" data-act="ui" data-k="reassign" data-v="1">Reasignar</button></div>`}</div>`;
    } else if (t.estado === 'pendiente' && S.ui.reassign) decide = `<div class="card">${reassign}</div>`;
    const manage = S.ui.del
      ? `<div class="card bad"><p><b>¿Quitar «${esc(t.nombre)}» de tu panel?</b></p><p class="small muted">Se borra con su historial. No se puede deshacer.</p>
          <div class="btns"><button class="btn ghost" data-act="ui" data-k="del" data-v="">Cancelar</button><button class="btn badb" data-act="del-task" data-id="${t.id}">Quitar tarea</button></div></div>`
      : `<div class="btns"><button class="btn sm" data-act="edit-task" data-id="${t.id}">Editar tarea</button>
          ${t.estado === 'pendiente' && !S.ui.reassign ? `<button class="btn sm" data-act="ui" data-k="reassign" data-v="1">Reasignar</button>` : ''}
          ${t.estado === 'cerrada' ? `<button class="btn sm" data-act="repeat" data-id="${t.id}">Repetir tarea</button>` : ''}
          <button class="btn sm badb" data-act="ui" data-k="del" data-v="1">Quitar</button></div>`;
    return `<button class="back" data-act="back">‹ Volver</button>
      <div class="detail-h"><div class="folio">${t.id}${t.frecuencia ? ' · ' + esc(t.frecuencia) : ''}${t.siempre ? ' · siempre pasa por ti' : ''}</div>
        <h1>${esc(t.nombre || 'Tarea sin nombre')}</h1>
        <div class="task-top" style="align-items:center"><span class="bigamount">${t.monto ? fmt(t.monto) : 'Sin monto'}</span><span class="stamp-mini ${e.c}">${e.stamp}</span></div>
        <div class="meta"><span class="avatar sm">${initials(nameOf(t.responsable))}</span><span style="align-self:center">${esc(nameOf(t.responsable))}${t.cierre === 'dueño' ? ' · aprobada por ti' : t.cierre === 'pauta' ? ' · cerrada por pauta' : ''}</span></div>
        ${t.descripcion ? `<p class="small muted">${esc(t.descripcion)}</p>` : ''}</div>
      ${taskIncomplete(t) ? '<div class="reason bad">A esta tarea le faltan datos obligatorios. Toca «Editar tarea» para completarla.</div>' : ''}
      ${t.motivo ? `<div class="reason ${e.c}">${esc(t.motivo)}</div>` : ''}
      ${decide}${manage}${checksBlock(t)}
      <div class="card"><div class="sec-h"><h3>Historial</h3><small>quién hizo qué</small></div>
        <ul class="timeline">${t.historial.map(h => `<li><span class="h">${h.h}</span><span>${h.txt}</span></li>`).join('')}</ul></div>`;
  }

  function vEquipo() {
    return `${absentBanner()}
      <div class="totalline"><b>${S.people.length} persona${S.people.length === 1 ? '' : 's'}</b><button class="btn sm primary" style="flex:none" data-act="new-person">+ Agregar colaborador</button></div>
      ${S.people.map(p => {
        const open = S.tasks.filter(t => t.responsable === p.id && (t.estado === 'pendiente' || t.estado === 'devuelta')).length;
        const inc = !p.owner && Object.keys(valPerson('people.' + p.id)).length > 0;
        return `<div class="card${inc ? ' bad' : ''}"><div class="person"><div class="avatar${p.disponible ? '' : ' off'}">${initials(p.nombre)}</div>
          <div class="sec" style="gap:8px">
            <div class="task-top"><div><b>${esc(p.nombre || 'Sin nombre')}</b><div class="small muted">${esc(p.cargo || 'Sin cargo')}${p.contacto ? ' · ' + esc(p.contacto) : ''}</div></div>
              ${p.owner ? '<span class="pill idle">Aprueba</span>' : `<span class="pill ${open ? 'gray' : 'ok'}">${open} abierta${open === 1 ? '' : 's'}</span>`}</div>
            ${inc ? '<span class="flag">Faltan datos obligatorios</span>' : ''}
            ${p.owner ? `<div class="small muted">Recibe lo que supera ${fmt(limite())} y lo marcado como crítico.</div>` : `
              <div class="small muted">Reemplazo: <b>${esc(p.reemplazo ? nameOf(p.reemplazo) : 'sin reemplazo (pasa a ti)')}</b></div>
              <div class="toggle-row"><span>Disponible hoy</span><button class="switch" role="switch" aria-label="${esc(p.nombre)} disponible hoy" aria-checked="${p.disponible}" data-act="disp" data-p="${p.id}"></button></div>
              <div class="btns"><button class="btn sm" data-act="edit-person" data-id="${p.id}">Editar</button><button class="btn sm badb" data-act="del-person" data-id="${p.id}">Quitar</button></div>`}
          </div></div></div>`;
      }).join('')}
      ${uploader('colab')}`;
  }

  function vPersona() {
    if (!S.editP) return '<p>No hay un colaborador abierto.</p>';
    return `<button class="back" data-act="back">‹ Volver</button>${errSummary()}
      <div class="sec">${personFields('editP', S.editP)}</div>
      <p class="formnote"><span class="req">*</span> Obligatorio</p>
      <div class="btns"><button class="btn ghost" data-act="back">Cancelar</button><button class="btn primary" data-act="save-person">${S.editP.isNew ? 'Agregar' : 'Guardar cambios'}</button></div>`;
  }

  function vEmpresa() {
    if (!S.editE) S.editE = clone(S.empresa);
    return `${errSummary()}<div class="sec">${empresaFields('editE', true)}</div>
      <p class="formnote"><span class="req">*</span> Obligatorio</p>
      <button class="btn primary" data-act="save-empresa">Guardar cambios</button>
      <div class="card"><div class="task-top"><div><b>${esc(S.account?.nombre || '')}</b><div class="small muted">${esc(S.account?.correo || '')}</div></div></div>
        <button class="btn" data-act="logout">Cerrar sesión</button></div>`;
  }

  function vProbar() {
    if (S.sent) {
      return `<div class="stampwrap"><span class="stamp ok anim">Recibida<small>Tarea de prueba</small></span></div>
        <div class="sec" style="text-align:center"><h2 style="font-family:var(--f-display);font-size:22px">Gracias, ${esc(S.pf.nombre.split(' ')[0])}.</h2>
          <p class="muted">En el servicio real, el equipo de The Back Office te escribe por WhatsApp para armar la pauta contigo y dejarla lista con tu equipo.</p>
          <p class="small muted">Esto es un prototipo: el formulario no envía nada.</p></div>
        <button class="btn primary" data-act="tab" data-to="panel">Volver al panel</button>`;
    }
    return `<button class="back" data-act="back">‹ Volver</button>
      <div class="sec"><h2 style="font-family:var(--f-display);font-size:24px;line-height:1.1">Comparte una tarea real y la dejamos funcionando</h2>
        <ol class="howto">
          <li><span><b>Nos cuentas la tarea y su pauta</b>Qué debe cumplirse para darla por terminada.</span></li>
          <li><span><b>La configuramos con tu equipo</b>Quién la hace, quién lo reemplaza y desde qué monto pasa por ti.</span></li>
          <li><span><b>Tu equipo la usa desde el celular</b>Tú solo ves lo que supera tu límite o no calza.</span></li>
        </ol></div>
      ${errSummary()}
      <form class="sec" data-submit="probar" novalidate>
        ${F('pf.nombre', 'Tu nombre', { req: true, ac: 'name' })}
        ${F('pf.wsp', 'WhatsApp', { req: true, im: 'tel', ph: '+56 9 1234 5678', hint: 'Te escribimos por aquí para configurarla.' })}
        ${F('pf.tarea', 'Tarea que quieres probar', { req: true, ph: 'Ej: recepción de mercadería' })}
        ${F('pf.pauta', '¿Qué debe cumplirse antes de cerrarla?', { area: true, ph: 'Ej: que lo recibido calce con la orden de compra' })}
        ${F('pf.quien', '¿Quiénes participan?', { ph: 'Ej: bodeguero y asistente' })}
        <div class="reason info">Plan mensual de $30.000. La primera tarea la configuramos contigo sin costo.</div>
        <p class="formnote"><span class="req">*</span> Obligatorio</p>
        <button class="btn primary" type="submit">Enviar mi tarea</button>
      </form>`;
  }

  /* ---------- vista del colaborador ---------- */
  const myOpen = () => S.tasks.filter(t => t.responsable === S.viewer && (t.estado === 'pendiente' || t.estado === 'devuelta') && !taskIncomplete(t));

  function vMis() {
    const me = person(S.viewer);
    const mine = myOpen();
    const todo = mine.filter(t => t.estado === 'pendiente'), fix = mine.filter(t => t.estado === 'devuelta');
    const moved = mine.filter(t => t.reasignadaDe);
    const card = (t, cls, btn) => `<div class="card ${cls}"><div class="task-top"><div><div class="folio">${t.id}${t.frecuencia ? ' · ' + esc(t.frecuencia) : ''}</div><div class="task-title">${esc(t.nombre)}</div></div><div class="amount">${t.monto ? fmt(t.monto) : ''}</div></div>
      ${t.estado === 'devuelta' ? `<div class="reason bad">${esc(t.motivo)}</div>` : `<div class="meta"><span>${t.pauta.length} punto${t.pauta.length === 1 ? '' : 's'} en la pauta</span></div>`}
      <div class="btns">${btn}</div></div>`;
    return `${!me.disponible ? `<div class="banner info"><span><b>Hoy estás marcado como no disponible.</b> Tus tareas pasaron a ${esc(me.reemplazo ? first(me.reemplazo) : first(owner().id))}.</span></div>` : ''}
      ${moved.length ? `<div class="banner info"><span><b>${moved.length > 1 ? `Te llegaron ${moved.length} tareas` : 'Te llegó 1 tarea'} de ${esc(first(moved[0].reasignadaDe))}</b>, que no está hoy.</span></div>` : ''}
      ${fix.length ? `<section class="sec"><div class="sec-h"><h3>Para corregir · ${fix.length}</h3><small>no pasaron la pauta</small></div>
        ${fix.map(t => card(t, 'bad', `<button class="btn primary" data-act="start" data-id="${t.id}">Corregir</button>${t.checks && t.checks.some(c => c.k === 'numero' && !c.ok) ? `<button class="btn" data-act="escalate" data-id="${t.id}">Avisar diferencia</button>` : ''}`)).join('')}</section>` : ''}
      <section class="sec"><div class="sec-h"><h3>Por hacer · ${todo.length}</h3></div>
        ${todo.length ? todo.map(t => card(t, '', `<button class="btn primary" data-act="start" data-id="${t.id}">Empezar</button>`)).join('') : '<div class="list"><div class="empty">No tienes tareas pendientes.</div></div>'}</section>`;
  }

  function vHechas() {
    const mine = S.tasks.filter(t => t.responsable === S.viewer && (t.estado === 'cerrada' || t.estado === 'aprobacion'));
    if (!mine.length) return '<div class="list"><div class="empty">Todavía no envías tareas.</div></div>';
    return `<div class="list">${mine.slice().reverse().map(t => {
      const e = ESTADO[t.estado];
      const lbl = t.estado === 'cerrada' ? (t.cierre === 'dueño' ? 'Aprobada' : 'Cerrada sola') : 'Con el dueño';
      return `<div class="lrow"><span class="tick ${e.c}">${e.mark}</span><span class="t">${esc(t.nombre)}<small>${t.id}${t.monto ? ' · ' + fmt(t.monto) : ''}</small></span><span class="pill ${e.c}">${lbl}</span></div>`;
    }).join('')}</div>`;
  }

  function startDraft(t) {
    const prev = t.checks || [];
    S.draft = { id: t.id, nota: '', vals: t.pauta.map((p, i) => {
      const c = prev[i]; if (!c || c.t !== p.t) return p.k === 'check' ? false : p.k === 'foto' ? null : '';
      if (p.k === 'check') return !!c.ok;
      if (p.k === 'foto') return c.ok ? { name: c.archivo || 'adjunto.jpg', url: null } : null;
      return c.valor ?? '';
    }) };
  }

  function vHacer() {
    const t = task(S.param), d = S.draft;
    if (!t || !d || d.id !== t.id) return '<p>No hay una tarea abierta.</p>';
    const goes = t.siempre ? 'Esta tarea siempre pasa por el dueño.' : t.monto > limite() ? `El monto supera ${fmt(limite())}: si todo calza, pasa al dueño.` : 'Si todo calza con la pauta, se cierra sola.';
    return `<button class="back" data-act="back">‹ Mis tareas</button>
      <div class="detail-h"><div class="folio">${t.id}</div><h1>${esc(t.nombre)}</h1>${t.monto ? `<span class="bigamount">${fmt(t.monto)}</span>` : ''}${t.descripcion ? `<p class="small muted">${esc(t.descripcion)}</p>` : ''}</div>
      ${t.estado === 'devuelta' ? `<div class="reason bad">Por corregir: ${esc(t.motivo)}</div>` : ''}
      <div class="card"><div class="sec-h"><h3>Pauta</h3><small>completa cada punto</small></div><div>
        ${t.pauta.map((p, i) => {
          const v = d.vals[i];
          if (p.k === 'numero') {
            const diff = v === '' || blank(p.esperado) ? '' : Number(v) === Number(p.esperado) ? '<span class="diff-ok">Calza</span>' : `<span class="diff-bad">Diferencia: ${Number(v) - Number(p.esperado) > 0 ? '+' : ''}${Number(v) - Number(p.esperado)}</span>`;
            return `<div class="todo" style="grid-template-columns:1fr;cursor:default"><span><b>${esc(p.t)}</b>
              <span class="photo"><input id="q-${i}" type="number" min="0" inputmode="decimal" value="${esc(v)}" data-input="qty" data-i="${i}" aria-label="${esc(p.t)}" placeholder="0" style="width:90px;text-align:right;font-family:var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)">
              <span class="small muted">${blank(p.esperado) ? 'Registra la cantidad' : 'Esperado: ' + esc(p.esperado)}</span><span class="small" id="diff-${i}">${diff}</span></span></span></div>`;
          }
          if (p.k === 'foto') return `<div class="todo" style="cursor:default"><span class="cbox" style="${v ? 'background:var(--ok);border-color:var(--ok);color:var(--card)' : ''}">✓</span>
            <span>${esc(p.t)}<span class="photo">${v ? `${v.url ? `<img class="thumbimg" src="${v.url}" alt="">` : '<span class="thumb" aria-hidden="true"></span>'}<span class="small mono" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(v.name)}</span><button class="linkbtn" data-act="unfoto" data-i="${i}">Quitar</button>`
              : `<label class="btn sm" style="flex:none" for="ph-${i}">Tomar foto o subir archivo</label><input class="vh" type="file" id="ph-${i}" accept="image/*,application/pdf" data-photo="${i}">`}</span></span></div>`;
          return `<button class="todo" role="checkbox" aria-checked="${!!v}" data-act="chk" data-i="${i}"><span class="cbox">✓</span><span>${esc(p.t)}</span></button>`;
        }).join('')}</div></div>
      <div class="field"><label for="f-nota">Nota <span class="opt">(opcional)</span></label><textarea id="f-nota" data-input="nota" placeholder="Ej: el proveedor envía lo que falta el jueves">${esc(d.nota)}</textarea></div>
      <div class="reason info">${goes}</div>
      <button class="btn primary" data-act="submit">Cerrar tarea</button>`;
  }

  function submitDraft() {
    const t = task(S.draft.id), d = S.draft;
    t.checks = t.pauta.map((p, i) => {
      const v = d.vals[i];
      if (p.k === 'numero') {
        if (v === '' || v == null) return { t: p.t, k: p.k, ok: false, valor: '', esperado: p.esperado, detalle: `Falta registrar: ${p.t.toLowerCase()}` };
        const ok = blank(p.esperado) || Number(v) === Number(p.esperado);
        return { t: p.t, k: p.k, ok, valor: v, esperado: p.esperado, detalle: ok ? '' : `Diferencia en ${p.t.toLowerCase()}: ${v} de ${p.esperado}` };
      }
      if (p.k === 'foto') return { t: p.t, k: p.k, ok: !!v, archivo: v ? v.name : '', detalle: v ? '' : `Falta: ${p.t.toLowerCase()}` };
      return { t: p.t, k: p.k, ok: !!v, detalle: v ? '' : `No marcado: ${p.t.toLowerCase()}` };
    });
    log(t, `<b>${esc(nameOf(S.viewer))}</b> ${t.estado === 'devuelta' ? 'corrigió y reenvió' : 'completó'} la pauta${d.nota ? `. Nota: «${esc(d.nota)}»` : ''}`);
    t.responsable = S.viewer; evaluate(t);
    S.draft = null; stampNext = true;
    go('resultado', t.id, false);
  }

  function vResultado() {
    const t = task(S.param); if (!t) return '';
    const e = ESTADO[t.estado];
    const txt = {
      cerrada: ['Se cerró sola', 'Todo calzó con la pauta y el monto está bajo el límite. No tuvo que pasar por el dueño.'],
      aprobacion: ['Pasó al dueño', `La pauta se cumplió. ${t.motivo}, así que ${owner().nombre.split(' ')[0]} la aprueba.`],
      devuelta: ['Falta algo', 'La tarea no se cerró. Corrige lo que falta o, si la diferencia es real, avísale al dueño.'],
    }[t.estado] || ['', ''];
    const anim = stampNext ? ' anim' : ''; stampNext = false;
    const hasDiff = t.checks.some(c => c.k === 'numero' && !c.ok && c.valor !== '');
    return `<div class="stampwrap"><span class="stamp ${e.c}${anim}">${e.stamp}<small>${t.id}</small></span></div>
      <div class="sec" style="text-align:center"><h2 style="font-family:var(--f-display);font-size:24px">${txt[0]}</h2><p class="muted">${esc(txt[1])}</p></div>
      ${t.estado === 'devuelta' ? `<div class="reason bad">${esc(t.motivo)}</div>` : ''}
      ${checksBlock(t)}
      <div class="btns">${t.estado === 'devuelta' ? `<button class="btn primary wide" data-act="start" data-id="${t.id}">Corregir ahora</button>${hasDiff ? `<button class="btn wide" data-act="escalate" data-id="${t.id}">Avisar diferencia al dueño</button>` : ''}` : ''}
        <button class="btn ${t.estado === 'devuelta' ? 'ghost' : 'primary'} wide" data-act="tab" data-to="mis">Volver a mis tareas</button></div>`;
  }

  /* ==================================================================
     Guía lateral
  ================================================================== */
  const STEPS = [
    ['Crea tu cuenta', 'Registro o inicio de sesión', 'auth'],
    ['Completa empresa, equipo y tareas', 'Campos obligatorios o archivo', 'onb'],
    ['Agrega o edita una tarea del panel', 'El panel se adapta a tu empresa', 'tareas'],
    ['Como colaborador, cierra una tarea', 'Vista del equipo en el celular', 'colab'],
    ['Aprueba lo que supera tu límite', 'Vista del dueño', 'panel'],
    ['Pide probarlo con una tarea real', 'La petición del MVP', 'probar'],
  ];
  function guideHTML() {
    const here = !isOwner() && S.onbDone ? 'colab' : ({ editor: 'tareas', tarea: 'tareas' }[S.screen] || S.screen);
    const canFill = S.screen === 'auth' || S.screen === 'onb';
    return `<div class="brandline">Prototipo navegable · MVP Mago de Oz</div>
      <h1>The Back Office</h1>
      <p class="lede">El cliente arma su propio panel de tareas. Su equipo las cierra contra una pauta y al dueño solo le llega lo que supera su límite o no calza.</p>
      <div class="sec-h"><h3>Guion de la prueba de uso</h3></div>
      <ol class="steps">${STEPS.map(([a, b, to]) => `<li class="${here === to ? 'here' : ''}"><span>${a}<small>${b}</small></span><button class="linkbtn" data-act="jump" data-to="${to}">Ir</button></li>`).join('')}</ol>
      <div class="row">
        ${canFill ? '<button class="btn sm" style="flex:none" data-act="fill">Autocompletar este paso</button>' : ''}
        <button class="btn sm" style="flex:none" data-act="load-demo">Cuenta de ejemplo (13 tareas)</button>
        <button class="btn sm" style="flex:none" data-act="reset">Reiniciar</button>
      </div>
      <p class="note">Empresa, personas, montos y proveedores son ejemplos inventados. En el MVP, el chequeo contra la pauta y la carga de archivos que no sean Excel o CSV los hace a mano el equipo de The Back Office; para el usuario se ve automático.</p>`;
  }

  /* ==================================================================
     Render
  ================================================================== */
  const VIEWS = { auth: vAuth, onb: vOnb, panel: vPanel, tareas: vTareas, tarea: vTarea, editor: vEditor, equipo: vEquipo, persona: vPersona, empresa: vEmpresa, probar: vProbar, mis: vMis, hechas: vHechas, hacer: vHacer, resultado: vResultado };

  function render(resetScroll) {
    const sc = app.querySelector('.scroll');
    const top = sc && !resetScroll ? sc.scrollTop : 0;
    const active = document.activeElement && document.activeElement.id;
    app.innerHTML = header() + `<main class="scroll">${(VIEWS[S.screen] || vPanel)()}</main>` + tabbar() + (S.toast ? `<div class="toast${S.toastFresh ? ' in' : ''}" role="status">${esc(S.toast)}</div>` : '');
    S.toastFresh = false;
    const nsc = app.querySelector('.scroll'); if (nsc) nsc.scrollTop = top;
    if (active && !resetScroll) { const el = document.getElementById(active); if (el && el.tagName !== 'BUTTON' && el.type !== 'file') el.focus({ preventScroll: true }); }
    setupFilters();
    guideEl.innerHTML = guideHTML();
    if (!sheet.hidden) sheetIn.innerHTML = `<div class="guide">${guideHTML()}</div><button class="btn" data-act="guide-close">Cerrar</button>`;
  }

  /* ==================================================================
     Acciones
  ================================================================== */
  function setViewer(id) { S.viewer = id; S.prev = []; S.draft = null; go(isOwner() ? 'panel' : 'mis', null, false); }
  function loadDemo(msg) { S = demo(); S.viewer = 'owner'; render(true); if (msg) toast(msg); }

  function reassignFrom(p) {
    let to = p.reemplazo && person(p.reemplazo)?.disponible ? p.reemplazo : owner().id;
    const moved = S.tasks.filter(t => t.responsable === p.id && (t.estado === 'pendiente' || t.estado === 'devuelta'));
    moved.forEach(t => { t.responsable = to; t.reasignadaDe = p.id; log(t, `${esc(p.nombre)} no está disponible. Pasó a <b>${esc(nameOf(to))}</b>`); });
    return [moved.length, to];
  }

  function act(a, d) {
    switch (a) {
      case 'noop': return;
      case 'tab': S.prev = []; return go(d.to, null, false);
      case 'go': return go(d.to);
      case 'back': return back();
      case 'open': return go('tarea', d.id);
      case 'filter': S.filter = d.f; S.prev = []; return go('tareas', null, false);
      case 'ui': S.ui[d.k] = d.v || null; return render();
      case 'authtab': S.authTab = d.to; S.errs = {}; return render();
      case 'forgot': return toast('En el prototipo no se recupera la contraseña.');

      case 'onb-prev': S.onb--; S.errs = {}; return render(true);
      case 'onb-next': {
        const e = valOnb(S.onb);
        if (Object.keys(e).length) return failWith(e);
        S.errs = {};
        if (S.onb < 3) { S.onb++; return render(true); }
        S.onbDone = true; S.prev = []; S.viewer = 'owner';
        go('panel', null, false); return toast('Listo. Este es tu panel.');
      }
      case 'add-person-inline': S.people.push({ id: newPid(), nombre: '', cargo: '', contacto: '', reemplazo: '', disponible: true }); render();
        requestAnimationFrame(() => { const c = app.querySelectorAll('.card'); c[c.length - 1]?.scrollIntoView({ block: 'center' }); c[c.length - 1]?.querySelector('input')?.focus({ preventScroll: true }); }); return;
      case 'del-person': {
        const p = person(d.id); if (!p) return;
        S.people = S.people.filter(x => x.id !== d.id);
        S.people.forEach(x => { if (x.reemplazo === d.id) x.reemplazo = ''; });
        S.tasks.forEach(t => { if (t.responsable === d.id) t.responsable = ''; });
        Object.keys(S.errs).forEach(k => { if (k.startsWith('people.' + d.id)) delete S.errs[k]; });
        toast(`${p.nombre || 'Colaborador'} quitado`); return render();
      }
      case 'new-person': S.editP = { id: null, isNew: true, nombre: '', cargo: '', contacto: '', reemplazo: '', disponible: true }; return go('persona');
      case 'edit-person': S.editP = clone(person(d.id)); return go('persona');
      case 'save-person': {
        const e = valPerson('editP'); if (Object.keys(e).length) return failWith(e);
        const p = S.editP; delete p.isNew;
        if (p.id) Object.assign(person(p.id), p); else { p.id = newPid(); S.people.push(p); }
        toast(`${p.nombre} guardado`); S.editP = null; return back();
      }
      case 'disp': {
        const p = person(d.p); p.disponible = !p.disponible;
        if (!p.disponible) { const [n, to] = reassignFrom(p); toast(n ? `${n} tarea${n > 1 ? 's' : ''} de ${p.nombre.split(' ')[0]} pasaron a ${first(to)}` : `${p.nombre.split(' ')[0]} no tiene tareas abiertas`); }
        else toast(`${p.nombre.split(' ')[0]} vuelve a recibir tareas`);
        return render();
      }

      case 'new-task': S.edit = { id: null, nombre: '', responsable: '', monto: '', frecuencia: '', descripcion: '', siempre: false, pauta: [P('')] }; return go('editor');
      case 'edit-task': { const t = clone(task(d.id)); t.monto = t.monto ? String(t.monto) : ''; S.edit = t; return go('editor'); }
      case 'add-point': S.edit.pauta.push(P('')); render();
        requestAnimationFrame(() => document.getElementById(`f_edit_pauta_${S.edit.pauta.length - 1}_t`)?.focus()); return;
      case 'del-point': S.edit.pauta.splice(Number(d.i), 1); S.errs = {}; return render();
      case 'edit-siempre': S.edit.siempre = !S.edit.siempre; return render();
      case 'save-task': {
        const e = valTask('edit'); if (Object.keys(e).length) return failWith(e);
        const x = S.edit; const monto = money(x.monto) || 0;
        x.pauta.forEach(p => { p.t = p.t.trim(); if (p.k !== 'numero') p.esperado = ''; });
        if (x.id) {
          const t = task(x.id);
          const fromResp = t.responsable;
          Object.assign(t, { nombre: x.nombre.trim(), responsable: x.responsable, monto, frecuencia: x.frecuencia, descripcion: x.descripcion, siempre: x.siempre, pauta: x.pauta });
          log(t, `<b>${esc(owner().nombre)}</b> editó la tarea${fromResp !== x.responsable ? ` y la asignó a <b>${esc(nameOf(x.responsable))}</b>` : ''}`);
          if (t.estado === 'pendiente') { delete t.checks; }
          toast('Cambios guardados');
        } else { S.tasks.push(newTask({ ...x, monto })); toast('Tarea agregada a tu panel'); }
        S.edit = null; return back();
      }
      case 'del-task-now': S.tasks = S.tasks.filter(t => t.id !== d.id); return render();
      case 'del-task': { const t = task(d.id); S.tasks = S.tasks.filter(x => x.id !== d.id); toast(`Quitada: ${t.nombre}`); return back(); }
      case 'repeat': { const t = task(d.id); const n = newTask(t); S.tasks.push(n); toast(`Nueva ${n.id} por hacer`); return go('tarea', n.id, false); }

      case 'approve': {
        const t = task(d.id); t.estado = 'cerrada'; t.cierre = 'dueño'; t.motivo = '';
        log(t, `<b>${esc(nameOf(S.viewer))}</b> aprobó la tarea`); toast(`Aprobada: ${t.nombre}`);
        return S.screen === 'tarea' ? back() : render();
      }
      case 'reject': {
        const t = task(d.id); const txt = (document.getElementById('f-rej')?.value || '').trim();
        t.estado = 'devuelta'; t.motivo = txt ? `Comentario del dueño: ${txt}` : 'Devuelta por el dueño para revisar';
        log(t, `<b>${esc(nameOf(S.viewer))}</b> la devolvió${txt ? `: «${esc(txt)}»` : ''}`);
        S.ui = {}; toast(`Devuelta a ${first(t.responsable)}`); return render();
      }
      case 'reassign': {
        const t = task(d.id); const to = document.getElementById('f-re').value; const from = t.responsable;
        t.responsable = to; if (t.estado === 'devuelta') t.estado = 'pendiente';
        log(t, `<b>${esc(nameOf(S.viewer))}</b> la pasó de ${esc(first(from))} a <b>${esc(nameOf(to))}</b>`);
        S.ui = {}; toast(`Reasignada a ${first(to)}`); return render();
      }

      case 'save-empresa': {
        const e = valEmpresa('editE', true); if (Object.keys(e).length) return failWith(e);
        S.empresa = clone(S.editE); owner().cargo = S.empresa.cargo; toast('Datos de la empresa guardados'); return render();
      }
      case 'logout': S.screen = 'auth'; S.authTab = 'login'; S.auth = { nombre: '', correo: S.account?.correo || '', pass: '', pass2: '', terminos: false }; S.prev = []; S.viewer = 'owner'; S.errs = {}; return render(true);

      case 'start': { const t = task(d.id); if (!t) return; startDraft(t); return go('hacer', t.id); }
      case 'chk': S.draft.vals[d.i] = !S.draft.vals[d.i]; return render();
      case 'unfoto': S.draft.vals[d.i] = null; return render();
      case 'submit': return submitDraft();
      case 'escalate': {
        const t = task(d.id);
        t.estado = 'aprobacion'; t.motivo = `Diferencia reportada por ${first(S.viewer)}. ${t.checks.filter(c => !c.ok).map(c => c.detalle).join(' · ')}`;
        log(t, `<b>${esc(nameOf(S.viewer))}</b> avisó la diferencia al dueño`);
        toast('Enviada al dueño con la diferencia'); S.prev = []; return go('mis', null, false);
      }

      case 'copy-ex': {
        const pre = document.getElementById('ex-' + d.k); const txt = pre.textContent;
        const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo con Ctrl+C'); };
        try { navigator.clipboard.writeText(txt).then(() => toast('Ejemplo copiado: pégalo en Excel'), sel); } catch (err) { sel(); }
        return;
      }
      case 'paste': {
        const txt = document.getElementById('paste-' + d.k)?.value || '';
        if (!txt.trim()) { toast('Pega primero las filas copiadas desde Excel'); document.getElementById('paste-' + d.k)?.focus(); return; }
        importRows(d.k, parseTable(txt), 'las filas pegadas'); return render();
      }

      case 'fscroll': { const el = document.getElementById('filters'); if (el) el.scrollBy({ left: Number(d.d) * el.clientWidth * 0.7, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
      case 'fill': return fillExample();
      case 'load-demo': closeSheet(); return loadDemo('Entraste a la cuenta de ejemplo: Taller Pérez');
      case 'jump': {
        closeSheet();
        if (d.to === 'auth') { S = base(); return render(true); }
        if (d.to === 'onb') { if (!S.account) { S = base(); toast('Primero crea tu cuenta'); return render(true); } S.onbDone = false; S.onb = 1; S.prev = []; return go('onb', null, false); }
        if (!S.onbDone) loadDemo();
        if (d.to === 'colab') {
          const c = S.people.find(p => !p.owner && S.tasks.some(t => t.responsable === p.id && t.estado === 'pendiente' && !taskIncomplete(t))) || S.people.find(p => !p.owner);
          if (c) return setViewer(c.id);
        }
        S.viewer = owner().id; S.prev = []; return go(d.to === 'colab' ? 'panel' : d.to, null, false);
      }
      case 'reset': closeSheet(); S = base(); return render(true);
      case 'guide': sheet.hidden = false; return render();
      case 'guide-close': return closeSheet();
    }
  }
  function closeSheet() { sheet.hidden = true; }

  /* ==================================================================
     Eventos
  ================================================================== */
  /* ---------- filtros deslizables: dedo, arrastre con mouse, rueda y flechas ---------- */
  function updateFade(el) {
    const w = el.parentElement; if (!w) return;
    const max = el.scrollWidth - el.clientWidth;
    w.classList.toggle('can-left', el.scrollLeft > 4);
    w.classList.toggle('can-right', el.scrollLeft < max - 4);
  }
  function setupFilters() {
    const el = document.getElementById('filters'); if (!el) return;
    el.scrollLeft = S.fscroll || 0;
    const a = el.querySelector('[aria-pressed="true"]');
    if (a) {
      if (a.offsetLeft - 16 < el.scrollLeft) el.scrollLeft = a.offsetLeft - 16;
      else if (a.offsetLeft + a.offsetWidth + 16 > el.scrollLeft + el.clientWidth) el.scrollLeft = a.offsetLeft + a.offsetWidth + 16 - el.clientWidth;
    }
    updateFade(el);
    el.addEventListener('scroll', () => { S.fscroll = el.scrollLeft; updateFade(el); }, { passive: true });
    el.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;
      const max = el.scrollWidth - el.clientWidth;
      if ((e.deltaY < 0 && el.scrollLeft <= 0) || (e.deltaY > 0 && el.scrollLeft >= max)) return;
      e.preventDefault(); el.scrollLeft += e.deltaY;
    }, { passive: false });
  }
  let drag = null, justDragged = false;
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest && e.target.closest('.filters');
    if (!el || e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { el, x: e.clientX, left: el.scrollLeft, moved: false };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; drag.el.classList.add('dragging'); }
    if (drag.moved) drag.el.scrollLeft = drag.left - dx;
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    if (drag.moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 0); }
    drag.el.classList.remove('dragging'); drag = null;
  });

  document.addEventListener('click', e => {
    if (justDragged && e.target.closest('.filters')) { e.preventDefault(); return; }
    if (e.target === sheet) return closeSheet();
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    e.preventDefault(); act(el.dataset.act, el.dataset);
  });
  function bindField(el) {
    setPath(el.dataset.f, el.type === 'checkbox' ? el.checked : el.value);
    const w = el.closest('.field');
    if (w && w.classList.contains('invalid')) { w.classList.remove('invalid'); el.removeAttribute('aria-invalid'); w.querySelector('.err')?.remove(); delete S.errs[el.dataset.f]; }
  }
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.f) bindField(el);
    if (el.dataset.input === 'nota' && S.draft) S.draft.nota = el.value;
    if (el.dataset.input === 'qty' && S.draft) {
      const i = Number(el.dataset.i); S.draft.vals[i] = el.value;
      const p = task(S.draft.id).pauta[i]; const cell = document.getElementById('diff-' + i);
      if (cell) cell.innerHTML = el.value === '' || blank(p.esperado) ? '' : Number(el.value) === Number(p.esperado) ? '<span class="diff-ok">Calza</span>' : `<span class="diff-bad">Diferencia: ${Number(el.value) - Number(p.esperado) > 0 ? '+' : ''}${Number(el.value) - Number(p.esperado)}</span>`;
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.change === 'viewas') return setViewer(el.value);
    if (el.dataset.f) { bindField(el); if (el.dataset.re) render(); }
    if (el.dataset.upload) { handleFile(el.dataset.upload, el.files[0]); el.value = ''; }
    if (el.dataset.photo !== undefined && S.draft) {
      const f = el.files[0]; if (!f) return;
      S.draft.vals[Number(el.dataset.photo)] = { name: f.name, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null };
      render();
    }
  });
  document.addEventListener('toggle', e => { const el = e.target; if (el.dataset && el.dataset.det) S.ui['det-' + el.dataset.det] = el.open; }, true);
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } }));
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
  document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); handleFile(z.dataset.drop, e.dataTransfer.files[0]); });

  document.addEventListener('submit', e => {
    const f = e.target; const kind = f.dataset.submit; if (!kind) return;
    e.preventDefault();
    if (kind === 'registro') {
      const er = valReg(); if (Object.keys(er).length) return failWith(er);
      S.account = { nombre: S.auth.nombre.trim(), correo: S.auth.correo.trim(), pass: S.auth.pass };
      S.people = [{ id: 'owner', nombre: S.account.nombre, cargo: '', contacto: S.account.correo, reemplazo: '', disponible: true, owner: true }];
      S.viewer = 'owner'; S.onb = 1; S.errs = {}; S.prev = [];
      S.pf.nombre = S.account.nombre;
      go('onb', null, false); return toast('Cuenta creada. Ahora, los datos de tu empresa.');
    }
    if (kind === 'login') {
      const er = valLogin(); if (Object.keys(er).length) return failWith(er);
      if (S.account && norm(S.account.correo) === norm(S.auth.correo)) {
        if (S.account.pass !== S.auth.pass) return failWith({ 'auth.pass': 'La contraseña no coincide con la de esta cuenta.' }, 'No pudimos entrar');
        S.errs = {}; S.prev = [];
        go(S.onbDone ? 'panel' : 'onb', null, false); return toast(`Hola de nuevo, ${S.account.nombre.split(' ')[0]}`);
      }
      return loadDemo('Entraste a la cuenta de ejemplo: Taller Pérez');
    }
    if (kind === 'probar') {
      const er = {};
      if (blank(S.pf.nombre)) er['pf.nombre'] = 'Escribe tu nombre.';
      if (blank(S.pf.wsp)) er['pf.wsp'] = 'Escribe un WhatsApp para contactarte.'; else if (!isPhone(S.pf.wsp)) er['pf.wsp'] = 'Revisa el número: debe tener al menos 8 dígitos.';
      if (blank(S.pf.tarea)) er['pf.tarea'] = 'Cuéntanos qué tarea quieres probar.';
      if (Object.keys(er).length) return failWith(er);
      S.sent = true; S.errs = {}; return render(true);
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  /* ==================================================================
     Inicio
  ================================================================== */
  const hash = (location.hash || '').slice(1);
  if (hash === 'ejemplo' || ['panel', 'tareas', 'equipo', 'empresa', 'probar'].includes(hash)) { S = demo(); if (hash !== 'ejemplo') S.screen = hash; }
  else if (hash === 'login') S.authTab = 'login';
  render(true);
})();
</script>
</body>
</html>
