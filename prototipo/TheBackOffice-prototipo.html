<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: guion de prueba a la izquierda + celular a la derecha en escritorio; en el teléfono, solo la app a pantalla completa. */
:root {
  --bg: #E6E9F0;
  --paper: #F6F7FA;
  --card: #FFFFFF;
  --ink: #131A2C;
  --muted: #5A6377;
  --line: #DADFE8;
  --accent: #2741C2;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FB;
  --head: #17203A;
  --head-ink: #F3F5FB;
  --head-muted: #A9B3CC;
  --frame: #1B2233;
  --ok: #1D7549;
  --ok-soft: #E0F2E8;
  --warn: #9A5600;
  --warn-soft: #FCEFD9;
  --bad: #B0261E;
  --bad-soft: #FBE5E2;
  --shadow: 0 30px 60px -30px rgba(19, 26, 44, .45);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D15; --paper: #10151F; --card: #171E2D; --ink: #E7EBF3; --muted: #98A2B6; --line: #263048;
    --accent: #8FA3FF; --accent-ink: #0B0F1A; --accent-soft: #1D2650; --head: #0B101C; --head-ink: #E7EBF3; --head-muted: #8A95AD;
    --frame: #2A3247; --ok: #62D39B; --ok-soft: #12301F; --warn: #F1B661; --warn-soft: #33260F; --bad: #FF8F85; --bad-soft: #3A1714;
    --shadow: 0 30px 60px -30px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D15; --paper: #10151F; --card: #171E2D; --ink: #E7EBF3; --muted: #98A2B6; --line: #263048;
  --accent: #8FA3FF; --accent-ink: #0B0F1A; --accent-soft: #1D2650; --head: #0B101C; --head-ink: #E7EBF3; --head-muted: #8A95AD;
  --frame: #2A3247; --ok: #62D39B; --ok-soft: #12301F; --warn: #F1B661; --warn-soft: #33260F; --bad: #FF8F85; --bad-soft: #3A1714;
  --shadow: 0 30px 60px -30px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- escenario ---------- */
.stage { display: flex; justify-content: center; align-items: center; gap: 56px; min-height: 100vh; padding-block: 32px; padding-inline: 24px; }
.guide { width: 340px; flex: none; display: flex; flex-direction: column; gap: 20px; }
.guide .brandline { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.guide h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.02em; }
.guide .lede { color: var(--muted); font-size: 15px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.steps li.here { border-color: var(--accent); }
.steps li span { font-size: 14px; }
.steps li small { display: block; color: var(--muted); font-size: 12px; }
.linkbtn { background: none; border: 0; padding: 4px 6px; color: var(--accent); font-weight: 600; font-size: 13px; border-radius: 6px; }
.guide .note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.guide .row { display: flex; gap: 8px; flex-wrap: wrap; }

.device { width: 392px; height: min(830px, calc(100vh - 64px)); min-height: 640px; border-radius: 46px; border: 11px solid var(--frame); background: var(--paper); overflow: hidden; box-shadow: var(--shadow); flex: none; position: relative; }
.app { height: 100%; display: flex; flex-direction: column; position: relative; }

@media (max-width: 899px) {
  html, body { height: 100%; }
  .stage { display: block; min-height: 0; height: 100%; padding: 0; }
  .guide { display: none; }
  .device { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}

/* ---------- cabecera ---------- */
.top { background: var(--head); color: var(--head-ink); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: none; }
.device .top { padding-top: 22px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--head-muted); }
.logo b { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--head-ink); display: inline-block; position: relative; }
.logo b::after { content: ""; position: absolute; left: 3px; top: 1px; width: 5px; height: 9px; border-right: 2px solid var(--head-ink); border-bottom: 2px solid var(--head-ink); transform: rotate(40deg); }
.top h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; line-height: 1.1; }
.top .sub { font-size: 12.5px; color: var(--head-muted); }
.viewas { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--head-muted); white-space: nowrap; }
.viewas select { background: transparent; border: 1px solid color-mix(in srgb, var(--head-ink) 30%, transparent); border-radius: 999px; padding: 4px 10px; color: var(--head-ink); font-size: 12.5px; font-weight: 600; max-width: 132px; }
.viewas select option { color: #131A2C; background: #FFFFFF; }
.guidebtn { display: none; background: transparent; border: 1px solid color-mix(in srgb, var(--head-ink) 30%, transparent); color: var(--head-ink); border-radius: 999px; font-size: 12px; padding: 4px 10px; font-weight: 600; }
@media (max-width: 899px) { .guidebtn { display: inline-block; } .viewas label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .viewas select { max-width: 124px; } .logo { font-size: 10.5px; } }

/* ---------- cuerpo ---------- */
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.sec-h small { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.kpi .n { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; }
.kpi .l { font-size: 12px; color: var(--muted); line-height: 1.25; }
.kpi.ok .n { color: var(--ok); }
.kpi.warn { background: var(--warn-soft); border-color: transparent; }
.kpi.warn .n { color: var(--warn); }
.kpi.bad .n { color: var(--bad); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.card.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.task-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.task-top > div { min-width: 0; }
.folio { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }
.task-title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.amount { font-family: var(--f-mono); font-weight: 600; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.reason { font-size: 13px; padding: 8px 10px; border-radius: 10px; }
.reason.warn { background: var(--warn-soft); color: var(--warn); }
.reason.bad { background: var(--bad-soft); color: var(--bad); }
.reason.ok { background: var(--ok-soft); color: var(--ok); }
.reason.info { background: var(--accent-soft); color: var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--accent-soft); color: var(--accent); }
.pill.gray { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); flex: 1; min-width: 0; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.okb { background: var(--ok); color: var(--card); border-color: var(--ok); }
.btn.ghost { background: transparent; }
.btn.badb { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 10px; }
.btn.wide { flex-basis: 100%; }
.btn:disabled { opacity: .5; cursor: default; }

.list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; width: 100%; text-align: left; }
.lrow:first-child { border-top: 0; }
.lrow .t { font-size: 14px; font-weight: 600; line-height: 1.3; min-width: 0; }
.lrow .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.tick.ok { background: var(--ok-soft); color: var(--ok); }
.tick.bad { background: var(--bad-soft); color: var(--bad); }
.tick.warn { background: var(--warn-soft); color: var(--warn); }
.tick.idle { background: var(--accent-soft); color: var(--accent); }

.banner { border-radius: 14px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner b { font-weight: 700; }

.cta { background: var(--head); color: var(--head-ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.cta h3 { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.cta p { color: var(--head-muted); font-size: 13.5px; }
.cta .btn { background: var(--head-ink); color: var(--head); border-color: var(--head-ink); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.filterwrap { position: relative; margin-inline: -16px; }
.filters { display: flex; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scroll-padding-inline: 16px; padding: 2px 16px 8px; cursor: grab; scrollbar-width: thin; scrollbar-color: var(--line) transparent; touch-action: pan-x pan-y; }
.filters::-webkit-scrollbar { height: 4px; }
.filters::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.filters.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.filters .chip { flex: none; white-space: nowrap; scroll-snap-align: start; }
.filterwrap::before, .filterwrap::after { content: ""; position: absolute; top: 0; bottom: 8px; width: 40px; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1; }
.filterwrap::before { left: 0; background: linear-gradient(90deg, var(--paper) 30%, transparent); }
.filterwrap::after { right: 0; background: linear-gradient(270deg, var(--paper) 30%, transparent); }
.filterwrap.can-left::before, .filterwrap.can-right::after { opacity: 1; }
.fbtn { position: absolute; top: 2px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 800; font-size: 15px; line-height: 1; display: none; place-items: center; padding: 0; box-shadow: 0 2px 6px rgba(19, 26, 44, .12); }
.fbtn.l { left: 6px; } .fbtn.r { right: 6px; }
.filterwrap.can-left .fbtn.l, .filterwrap.can-right .fbtn.r { display: grid; }
@media (prefers-reduced-motion: reduce) { .filterwrap::before, .filterwrap::after { transition: none; } }

.back { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 14px; }
.detail-h { display: flex; flex-direction: column; gap: 6px; }
.detail-h h1 { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; letter-spacing: -.01em; }
.bigamount { font-family: var(--f-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }

.checks { display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.check:first-child { border-top: 0; }
.check small { display: block; color: var(--bad); font-size: 12.5px; }

.qty { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.qty th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.qty td { padding: 8px 4px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
.qty td.num, .qty th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.qty input { width: 62px; text-align: right; font-family: var(--f-mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.diff-ok { color: var(--ok); font-weight: 600; }
.diff-bad { color: var(--bad); font-weight: 600; }

.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 7px 0; font-size: 13px; border-top: 1px dashed var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline .h { font-family: var(--f-mono); color: var(--muted); font-size: 12px; padding-top: 1px; }
.timeline b { font-weight: 700; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .flabel { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--card); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line); flex: none; padding: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

.person { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); }
.avatar.sm { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
.avatar.off { background: var(--paper); color: var(--muted); border: 1px dashed var(--line); }

.rangewrap { display: flex; flex-direction: column; gap: 8px; }
.rangewrap input[type=range] { width: 100%; accent-color: var(--accent); }
.limit-v { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }

.pauta-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pauta-items li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; }
.pauta-items .box { width: 16px; height: 16px; border: 2px solid var(--muted); border-radius: 4px; }
.kind { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.x { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; line-height: 1; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--paper); font-size: 13.5px; }

/* tareas del trabajador */
.todo { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 12px 0; border-top: 1px dashed var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font-size: 14.5px; }
.todo:first-child { border-top: 0; }
.cbox { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: 14px; color: transparent; }
.todo[aria-checked="true"] .cbox { background: var(--ok); border-color: var(--ok); color: var(--card); }
.photo { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.thumb { width: 54px; height: 40px; border-radius: 8px; background: repeating-linear-gradient(135deg, var(--accent-soft) 0 6px, var(--paper) 6px 12px); border: 1px solid var(--line); flex: none; }

/* timbre */
.stampwrap { display: grid; place-items: center; padding: 24px 0 8px; }
.stamp { display: inline-flex; flex-direction: column; align-items: center; font-family: var(--f-mono); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; border: 3px solid currentColor; border-radius: 12px; padding: 10px 20px; transform: rotate(-6deg); font-size: 24px; line-height: 1.1; box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 4px currentColor; }
.stamp small { font-size: 11px; letter-spacing: .12em; margin-top: 4px; }
.stamp.ok { color: var(--ok); } .stamp.warn { color: var(--warn); } .stamp.bad { color: var(--bad); }
.stamp.anim { animation: thump .5s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes thump { from { transform: rotate(-6deg) scale(1.9); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.stamp-mini { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; border: 2px solid currentColor; border-radius: 6px; padding: 2px 6px; transform: rotate(-4deg); display: inline-block; }
.stamp-mini.ok { color: var(--ok); } .stamp-mini.warn { color: var(--warn); } .stamp-mini.bad { color: var(--bad); } .stamp-mini.idle { color: var(--accent); }

/* onboarding */
.welcome { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.welcome h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.02em; }
.welcome .lede { font-size: 16px; color: var(--muted); }
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.progress i.on { background: var(--accent); }
.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: h; }
.howto li { counter-increment: h; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 14px; }
.howto li::before { content: counter(h); width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-family: var(--f-mono); font-size: 13px; }
.howto b { display: block; }

.tabbar { display: grid; border-top: 1px solid var(--line); background: var(--card); flex: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.device .tabbar { padding-bottom: 14px; }
.tab { background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--warn); color: var(--card); font-size: 10px; font-weight: 800; display: grid; place-items: center; }

.toast { pointer-events: none; position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 11px 14px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); z-index: 5; }
.toast.in { animation: up .25s ease-out both; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.sheet { position: fixed; inset: 0; background: rgba(10, 13, 21, .55); z-index: 20; display: flex; align-items: flex-end; }
.sheet-in { background: var(--paper); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-in .guide { display: flex; width: 100%; }

.empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 18px 8px; }

@media (prefers-reduced-motion: reduce) {
  .stamp.anim, .toast.in { animation: none; }
  .switch, .switch::after { transition: none; }
}

/* ---------- formularios con validación ---------- */
.req { color: var(--bad); font-weight: 800; }
.opt { color: var(--muted); font-weight: 500; font-size: 11.5px; letter-spacing: 0; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); background: var(--bad-soft); }
.err { font-size: 12.5px; color: var(--bad); font-weight: 600; }
.formnote { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
.checkline { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.checkline input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.errsum { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
.stepname { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.1; }

/* ---------- acceso ---------- */
.authhero { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.authhero h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.02em; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- carga de archivo ---------- */
.upload { border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--accent-soft) 40%, var(--card)); }
.upload-h { display: flex; flex-direction: column; gap: 2px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; border-radius: 12px; padding: 14px 10px; background: var(--card); border: 1px solid var(--line); cursor: pointer; font-weight: 700; color: var(--accent); font-size: 14px; }
.drop small { color: var(--muted); font-weight: 500; font-size: 12px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.upload details summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); }
.upload details[open] { display: flex; flex-direction: column; gap: 8px; }
.ex { margin: 0; font-family: var(--f-mono); font-size: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow-x: auto; white-space: pre; }

/* ---------- editor de pauta ---------- */
.point { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.point .field { gap: 4px; }
.point-n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.kpis.four { grid-template-columns: repeat(4, 1fr); }
.kpis.four .n { font-size: 26px; }
.kpi.idle .n { color: var(--accent); }
.totalline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.totalline b { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.flag { font-size: 11px; font-weight: 700; color: var(--bad); }
.thumbimg { width: 54px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); flex: none; }
.rowbtns { display: flex; gap: 4px; flex: none; }
</style>
</head>
<body>

<div class="stage">
  <aside class="guide" id="guide" aria-label="Guion de la prueba de uso"></aside>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<script>
(() => {
  'use strict';

  /* ==================================================================
     Utilidades
  ================================================================== */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
  const blank = s => !String(s ?? '').trim();
  const money = s => { const d = String(s ?? '').replace(/[^\d]/g, ''); return d === '' ? null : Number(d); };
  const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
  const isPhone = s => String(s || '').replace(/\D/g, '').length >= 8 && !/[a-z@]/i.test(String(s));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const clone = o => JSON.parse(JSON.stringify(o));
  const initials = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();

  function rutOk(r) {
    const c = String(r || '').replace(/[.\-\s]/g, '').toUpperCase();
    if (!/^\d{7,8}[0-9K]$/.test(c)) return false;
    const body = c.slice(0, -1), dv = c.slice(-1);
    let s = 0, m = 2;
    for (let i = body.length - 1; i >= 0; i--) { s += Number(body[i]) * m; m = m === 7 ? 2 : m + 1; }
    const x = 11 - (s % 11);
    return (x === 11 ? '0' : x === 10 ? 'K' : String(x)) === dv;
  }

  /* ==================================================================
     Estado
  ================================================================== */
  function base() {
    return {
      screen: 'auth', param: null, prev: [], authTab: 'registro', onb: 1, onbDone: false,
      viewer: 'owner', filter: 'todas', clock: 9 * 60, nextT: 101, nextP: 1,
      auth: { nombre: '', correo: '', pass: '', pass2: '', terminos: false },
      account: null, demo: false,
      empresa: { razon: '', fantasia: '', rut: '', giro: '', comuna: '', region: '', direccion: '', trabajadores: '', telefono: '', cargo: '', limite: '' },
      people: [], tasks: [],
      errs: {}, asistida: { colab: null, tareas: null }, importMsg: { colab: null, tareas: null },
      edit: null, editP: null, editE: null, draft: null, ui: {}, toast: null, sent: false,
      pf: { nombre: '', wsp: '', tarea: '', pauta: '', quien: '' },
    };
  }
  let S = base();

  const person = id => S.people.find(p => p.id === id);
  const owner = () => S.people.find(p => p.owner);
  const isOwner = () => !!person(S.viewer)?.owner;
  const nameOf = id => person(id)?.nombre || 'Sin responsable';
  const first = id => (person(id)?.nombre || 'Sin responsable').split(' ')[0];
  const task = id => S.tasks.find(t => t.id === id);
  const limite = () => money(S.empresa.limite) || 0;
  const empresaNombre = () => S.empresa.fantasia || S.empresa.razon || 'Tu empresa';
  const newPid = () => 'p' + (S.nextP++);
  const newTid = () => 'T-' + String(S.nextT++).padStart(4, '0');
  function now() { S.clock += 3; return String(Math.floor(S.clock / 60)).padStart(2, '0') + ':' + String(S.clock % 60).padStart(2, '0'); }
  function log(t, txt) { t.historial.push({ h: now(), txt }); }

  function getPath(path) {
    let o = S;
    for (const k of path.split('.')) { if (o == null) return ''; o = Array.isArray(o) && isNaN(k) ? o.find(x => x.id === k) : o[k]; }
    return o;
  }
  function setPath(path, val) {
    const seg = path.split('.'); let o = S;
    for (let i = 0; i < seg.length - 1; i++) { const k = seg[i]; o = Array.isArray(o) && isNaN(k) ? o.find(x => x.id === k) : o[k]; if (o == null) return; }
    o[seg[seg.length - 1]] = val;
  }

  /* ---------- cuenta de ejemplo (13 tareas). Todo es inventado. ---------- */
  const P = (t, k = 'check', esperado = '') => ({ t, k, esperado: String(esperado) });
  function demo() {
    const s = base();
    Object.assign(s, { screen: 'panel', onbDone: true, demo: true, clock: 10 * 60 + 5 });
    s.account = { nombre: 'Jorge Pérez', correo: 'jorge@tallerperez.cl', pass: '' };
    s.empresa = { razon: 'Taller Pérez SpA', fantasia: 'Taller Pérez', rut: '76.543.210-3', giro: 'Taller de metalmecánica', comuna: 'Puerto Montt', region: 'Los Lagos', direccion: 'Av. Presidente Ibáñez 1450', trabajadores: '9', telefono: '', cargo: 'Dueño', limite: '200000' };
    s.people = [
      { id: 'owner', nombre: 'Jorge Pérez', cargo: 'Dueño', contacto: 'jorge@tallerperez.cl', reemplazo: '', disponible: true, owner: true },
      { id: 'p1', nombre: 'Carla Muñoz', cargo: 'Asistente administrativa', contacto: 'carla@tallerperez.cl', reemplazo: 'p2', disponible: true },
      { id: 'p2', nombre: 'Luis Rojas', cargo: 'Encargado de bodega', contacto: '+56 9 8765 4321', reemplazo: 'p1', disponible: true },
      { id: 'p3', nombre: 'Pedro Soto', cargo: 'Jefe de taller', contacto: 'pedro@tallerperez.cl', reemplazo: 'p2', disponible: true },
    ];
    s.nextP = 4;
    const PAUTA = {
      fact: [P('Orden de compra del cliente adjunta', 'foto'), P('Monto coincide con la cotización aprobada'), P('RUT y razón social verificados')],
      pago: [P('Factura del proveedor registrada'), P('Monto coincide con la orden de compra'), P('Mercadería recibida conforme')],
      ent: [P('Puntos acordados con el cliente cumplidos'), P('Foto del trabajo terminado', 'foto'), P('Cliente firmó la recepción')],
      comp: [P('Cotización de al menos 2 proveedores'), P('Insumo está en la lista de compras del mes')],
      rec: [P('Foto de la guía de despacho', 'foto'), P('Productos sin daños visibles')],
    };
    let n = 101;
    const mk = (nombre, resp, monto, pauta, estado, extra = {}) => {
      const t = { id: 'T-' + String(n++).padStart(4, '0'), nombre, responsable: resp, monto, frecuencia: extra.frecuencia || '', descripcion: '', siempre: !!extra.siempre,
        pauta: clone(pauta), estado, motivo: extra.motivo || '', cierre: estado === 'cerrada' ? 'pauta' : '', historial: [] };
      const who = s.people.find(p => p.id === resp).nombre;
      t.historial.push({ h: extra.h || '08:30', txt: `Creada por <b>Jorge Pérez</b>` });
      if (estado !== 'pendiente') {
        t.checks = t.pauta.map(p => ({ t: p.t, k: p.k, ok: true, valor: p.k === 'numero' ? p.esperado : '', esperado: p.esperado }));
        if (extra.failIdx != null) { t.checks[extra.failIdx].ok = false; t.checks[extra.failIdx].detalle = extra.motivo; }
        t.historial.push({ h: extra.h || '09:00', txt: `<b>${who}</b> completó la pauta` });
        t.historial.push({ h: extra.h || '09:00', txt: estado === 'cerrada' ? 'Pauta cumplida y bajo el límite: <b>se cerró sola</b>' : estado === 'aprobacion' ? 'Pauta cumplida. Monto sobre el límite: <b>espera tu aprobación</b>' : `No pasó la pauta. Volvió a <b>${who}</b>` });
      }
      return t;
    };
    s.tasks = [
      mk('Recepción guía 4521 · Ferretería Austral', 'p2', 48300, [P('Cajas recibidas', 'numero', 4), ...PAUTA.rec], 'cerrada', { h: '08:41' }),
      mk('Pago gas industrial · Indura', 'p1', 64990, PAUTA.pago, 'cerrada', { h: '08:52' }),
      mk('Factura a Transportes Vidal', 'p1', 132000, PAUTA.fact, 'cerrada', { h: '09:03' }),
      mk('Entrega reparación de portón · Agrícola Riquelme', 'p3', 180000, PAUTA.ent, 'cerrada', { h: '09:10' }),
      mk('Compra de guantes y lentes de seguridad', 'p2', 29900, PAUTA.comp, 'cerrada', { h: '09:24' }),
      mk('Factura a Maestranza Lillo', 'p1', 156000, PAUTA.fact, 'cerrada', { h: '09:47' }),
      mk('Pago a proveedor · Aceros del Sur', 'p1', 850000, PAUTA.pago, 'aprobacion', { h: '09:55', motivo: 'Monto sobre tu límite de $200.000' }),
      mk('Compra de pernos y discos de corte', 'p2', 320000, PAUTA.comp, 'aprobacion', { h: '10:02', motivo: 'Monto sobre tu límite de $200.000' }),
      mk('Factura a Constructora Soto', 'p1', 95000, PAUTA.fact, 'devuelta', { h: '09:50', failIdx: 0, motivo: 'Falta: orden de compra del cliente adjunta' }),
      mk('Recepción OC 318 · Aceros del Sur', 'p2', 176400, [P('Planchas de acero 3 mm recibidas', 'numero', 10), P('Perfiles L 40×40×3 recibidos', 'numero', 24), P('Cajas de pernos M10 recibidas', 'numero', 6), ...PAUTA.rec], 'pendiente'),
      mk('Entrega carro de arrastre · Forestal Llanquihue', 'p3', 240000, PAUTA.ent, 'pendiente'),
      mk('Declaración mensual de IVA (F29)', 'p1', 412000, [P('Libro de compras y ventas cuadrado'), P('Borrador revisado por el contador', 'foto')], 'pendiente', { siempre: true, frecuencia: 'Mensual, antes del día 20' }),
      mk('Cobranza de facturas vencidas', 'p1', 0, [P('Lista de facturas vencidas revisada'), P('Correo de cobranza enviado a cada cliente'), P('Facturas con compromiso de pago', 'numero')], 'pendiente', { frecuencia: 'Semanal, los lunes' }),
    ];
    s.nextT = n;
    return s;
  }

  /* ---------- datos para autocompletar en la prueba ---------- */
  function fillExample() {
    if (S.screen === 'auth') {
      if (S.authTab === 'registro') S.auth = { nombre: 'Jorge Pérez', correo: 'jorge@tallerperez.cl', pass: 'taller2026', pass2: 'taller2026', terminos: true };
      else Object.assign(S.auth, { correo: 'jorge@tallerperez.cl', pass: 'taller2026' });
    } else if (S.screen === 'onb' && S.onb === 1) {
      Object.assign(S.empresa, { razon: 'Taller Pérez SpA', fantasia: 'Taller Pérez', rut: '76.543.210-3', giro: 'Taller de metalmecánica', comuna: 'Puerto Montt', region: 'Los Lagos', trabajadores: '9', cargo: 'Dueño' });
    } else if (S.screen === 'onb' && S.onb === 2) {
      S.people = S.people.filter(p => p.owner);
      const a = newPid(), b = newPid(), c = newPid();
      S.people.push(
        { id: a, nombre: 'Carla Muñoz', cargo: 'Asistente administrativa', contacto: 'carla@tallerperez.cl', reemplazo: b, disponible: true },
        { id: b, nombre: 'Luis Rojas', cargo: 'Encargado de bodega', contacto: '+56 9 8765 4321', reemplazo: a, disponible: true },
        { id: c, nombre: 'Pedro Soto', cargo: 'Jefe de taller', contacto: 'pedro@tallerperez.cl', reemplazo: b, disponible: true });
    } else if (S.screen === 'onb' && S.onb === 3) {
      S.empresa.limite = '200000';
      const ppl = S.people.filter(p => !p.owner);
      const r = i => (ppl[i] || ppl[0] || owner()).id;
      [['Recepción de mercadería OC 318', r(1), 176400, [P('Planchas de acero recibidas', 'numero', 10), P('Foto de la guía de despacho', 'foto'), P('Productos sin daños visibles')], 'Cada vez que llega un pedido'],
       ['Factura a cliente', r(0), 95000, [P('Orden de compra del cliente adjunta', 'foto'), P('Monto coincide con la cotización')], 'Diaria'],
       ['Pago a proveedor · Aceros del Sur', r(0), 850000, [P('Factura del proveedor registrada'), P('Monto coincide con la orden de compra')], 'Mensual']]
        .forEach(([nombre, resp, monto, pauta, frecuencia]) => S.tasks.push(newTask({ nombre, responsable: resp, monto, pauta, frecuencia })));
    } else return toast('Este paso no tiene datos de ejemplo.');
    S.errs = {}; render();
    toast('Completado con datos de ejemplo');
  }

  function newTask(t) {
    return { id: newTid(), nombre: t.nombre, responsable: t.responsable, monto: Number(t.monto) || 0, frecuencia: t.frecuencia || '', descripcion: t.descripcion || '', siempre: !!t.siempre,
      pauta: clone(t.pauta), estado: 'pendiente', motivo: '', cierre: '', historial: [{ h: now(), txt: `Creada por <b>${esc(owner()?.nombre || 'el dueño')}</b>` }] };
  }

  /* ==================================================================
     Validación: lo obligatorio debe estar completo para avanzar.
  ================================================================== */
  function valReg() {
    const f = S.auth, e = {};
    if (blank(f.nombre)) e['auth.nombre'] = 'Escribe tu nombre y apellido.';
    if (blank(f.correo)) e['auth.correo'] = 'Escribe tu correo.'; else if (!isEmail(f.correo)) e['auth.correo'] = 'Revisa el correo: debe tener @ y un dominio, como nombre@empresa.cl.';
    if ((f.pass || '').length < 8) e['auth.pass'] = 'La contraseña debe tener al menos 8 caracteres.';
    if (!f.pass2) e['auth.pass2'] = 'Repite la contraseña.'; else if (f.pass2 !== f.pass) e['auth.pass2'] = 'Las contraseñas no coinciden.';
    if (!f.terminos) e['auth.terminos'] = 'Acepta los términos para crear la cuenta.';
    return e;
  }
  function valLogin() {
    const f = S.auth, e = {};
    if (blank(f.correo)) e['auth.correo'] = 'Escribe tu correo.'; else if (!isEmail(f.correo)) e['auth.correo'] = 'Revisa el correo: debe tener @ y un dominio.';
    if (blank(f.pass)) e['auth.pass'] = 'Escribe tu contraseña.';
    return e;
  }
  function valEmpresa(pre, withLimit) {
    const o = getPath(pre), e = {};
    if (blank(o.razon)) e[pre + '.razon'] = 'Escribe la razón social.';
    if (blank(o.rut)) e[pre + '.rut'] = 'Escribe el RUT de la empresa.'; else if (!rutOk(o.rut)) e[pre + '.rut'] = 'El RUT no es válido. Revisa los números y el dígito verificador.';
    if (blank(o.giro)) e[pre + '.giro'] = 'Cuéntanos a qué se dedica la empresa.';
    if (blank(o.comuna)) e[pre + '.comuna'] = 'Escribe la comuna.';
    const n = Number(String(o.trabajadores).trim());
    if (blank(o.trabajadores)) e[pre + '.trabajadores'] = 'Indica cuántas personas trabajan en la empresa.'; else if (!Number.isInteger(n) || n < 1) e[pre + '.trabajadores'] = 'Debe ser un número entero mayor que 0.';
    if (blank(o.cargo)) e[pre + '.cargo'] = 'Indica tu cargo.';
    if (!blank(o.telefono) && !isPhone(o.telefono)) e[pre + '.telefono'] = 'Revisa el teléfono: debe tener al menos 8 dígitos.';
    if (withLimit) Object.assign(e, valLimit(pre));
    return e;
  }
  function valLimit(pre) {
    const v = String(getPath(pre + '.limite') ?? '').trim(), e = {};
    if (blank(v)) e[pre + '.limite'] = 'Define desde qué monto una tarea pasa por ti. Puede ser $0.';
    else if (v.includes('-')) e[pre + '.limite'] = 'El monto debe ser mayor o igual a $0.';
    else if (!/^\$?\s*\d[\d.\s]*$/.test(v)) e[pre + '.limite'] = 'Escribe solo números, por ejemplo 200000 o 0.';
    return e;
  }
  function valPerson(pre) {
    const p = getPath(pre), e = {};
    if (blank(p.nombre)) e[pre + '.nombre'] = 'Escribe el nombre.';
    if (blank(p.cargo)) e[pre + '.cargo'] = 'Escribe el cargo o rol.';
    if (blank(p.contacto)) e[pre + '.contacto'] = 'Agrega un correo o WhatsApp.'; else if (!isEmail(p.contacto) && !isPhone(p.contacto)) e[pre + '.contacto'] = 'Debe ser un correo válido o un número de al menos 8 dígitos.';
    return e;
  }
  function valTask(pre) {
    const t = getPath(pre), e = {};
    if (blank(t.nombre)) e[pre + '.nombre'] = 'Escribe el nombre de la tarea.';
    if (blank(t.responsable) || !person(t.responsable)) e[pre + '.responsable'] = 'Elige quién la hace.';

    if (!t.pauta.length) e[pre + '.pauta'] = 'Agrega al menos un punto a la pauta.';
    t.pauta.forEach((p, i) => {
      if (blank(p.t)) e[`${pre}.pauta.${i}.t`] = 'Describe qué se revisa.';
      if (p.k === 'numero' && !blank(p.esperado) && isNaN(Number(String(p.esperado).replace(',', '.')))) e[`${pre}.pauta.${i}.esperado`] = 'Debe ser un número.';
    });
    return e;
  }
  const taskIncomplete = t => Object.keys(valTask('tasks.' + t.id)).length > 0;

  function failWith(e, label) {
    S.errs = e; render();
    const n = Object.keys(e).length;
    toast(`${label || 'Faltan datos'}: ${n} campo${n > 1 ? 's' : ''} por revisar`);
    requestAnimationFrame(() => { const el = app.querySelector('.invalid input, .invalid select, .invalid textarea, .invalid'); if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus({ preventScroll: true }); } });
  }

  /* ==================================================================
     Regla central del MVP
  ================================================================== */
  function evaluate(t) {
    const fails = t.checks.filter(c => !c.ok);
    if (fails.length) {
      t.estado = 'devuelta'; t.motivo = fails.map(f => f.detalle || f.t).join(' · ');
      log(t, `No pasó la pauta (${fails.length} punto${fails.length > 1 ? 's' : ''}). Volvió a <b>${esc(nameOf(t.responsable))}</b>`);
    } else if (t.siempre) {
      t.estado = 'aprobacion'; t.motivo = 'Tarea marcada para que siempre pase por ti';
      log(t, 'Pauta cumplida. Tarea crítica: <b>espera tu aprobación</b>');
    } else if (t.monto > limite()) {
      t.estado = 'aprobacion'; t.motivo = `Monto sobre tu límite de ${fmt(limite())}`;
      log(t, 'Pauta cumplida. Monto sobre el límite: <b>espera tu aprobación</b>');
    } else {
      t.estado = 'cerrada'; t.cierre = 'pauta'; t.motivo = '';
      log(t, 'Pauta cumplida y bajo el límite: <b>se cerró sola</b>');
    }
  }

  /* ==================================================================
     Carga desde archivo o desde Excel pegado
  ================================================================== */
  const COLS = {
    colab: { nombre: ['nombre', 'nombre completo', 'colaborador', 'trabajador', 'persona'], cargo: ['cargo', 'rol', 'puesto', 'funcion'], contacto: ['contacto', 'correo', 'email', 'mail', 'whatsapp', 'telefono', 'celular', 'fono'], reemplazo: ['reemplazo', 'suplente', 'reemplaza'] },
    tareas: { nombre: ['tarea', 'nombre', 'nombre tarea'], responsable: ['responsable', 'encargado', 'quien'], pauta: ['pauta', 'puntos', 'checklist', 'revision'], monto: ['monto', 'valor', 'monto aproximado'], frecuencia: ['frecuencia', 'cada cuanto'], siempre: ['siempre revisar', 'siempre', 'critica', 'aprobacion'] },
  };
  const ORDER = { colab: ['nombre', 'cargo', 'contacto', 'reemplazo'], tareas: ['nombre', 'responsable', 'pauta', 'monto', 'frecuencia', 'siempre'] };

  function splitRow(l, d) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (q) { if (c === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true; else if (c === d) { out.push(cur); cur = ''; } else cur += c;
    }
    out.push(cur); return out.map(x => x.trim());
  }
  function parseTable(text) {
    const lines = String(text).replace(/\r/g, '').split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const h = lines[0];
    const d = h.includes('\t') ? '\t' : (h.split(';').length > h.split(',').length ? ';' : ',');
    return lines.map(l => splitRow(l, d));
  }

  function rowsToObjects(kind, rows) {
    const map = COLS[kind];
    const head = rows[0].map(norm);
    const idx = {};
    for (const [key, names] of Object.entries(map)) {
      const all = head.map((h, i) => names.includes(h) ? i : -1).filter(i => i >= 0);
      if (all.length) idx[key] = all;
    }
    const hasHeader = Object.keys(idx).length > 0;
    if (!hasHeader) ORDER[kind].forEach((k, i) => { idx[k] = [i]; });
    return rows.slice(hasHeader ? 1 : 0).map(r => {
      const o = {};
      for (const [k, list] of Object.entries(idx)) o[k] = (list.map(i => r[i] || '').find(v => v.trim()) || '').trim();
      return o;
    }).filter(o => Object.values(o).some(v => v));
  }

  const findPerson = name => {
    const n = norm(name); if (!n) return null;
    return S.people.find(p => norm(p.nombre) === n) || S.people.find(p => norm(p.nombre).split(' ')[0] === n.split(' ')[0]) || null;
  };

  function importRows(kind, rows, source) {
    const objs = rowsToObjects(kind, rows);
    if (!objs.length) { S.importMsg[kind] = { c: 'bad', html: `No encontramos filas con datos en <b>${esc(source)}</b>. Revisa que la primera fila tenga los nombres de las columnas.` }; return; }
    let bad = 0;
    if (kind === 'colab') {
      const added = objs.map(o => { const p = { id: newPid(), nombre: o.nombre || '', cargo: o.cargo || '', contacto: o.contacto || '', reemplazo: '', _rep: o.reemplazo || '', disponible: true }; S.people.push(p); return p; });
      added.forEach(p => { const r = findPerson(p._rep); p.reemplazo = r && r.id !== p.id ? r.id : ''; delete p._rep; });
      added.forEach(p => { const e = valPerson('people.' + p.id); if (Object.keys(e).length) { bad++; Object.assign(S.errs, e); } });
      S.importMsg.colab = { c: bad ? 'warn' : 'ok', html: `Agregamos <b>${added.length} colaborador${added.length > 1 ? 'es' : ''}</b> desde ${esc(source)}.${bad ? ` ${bad} ${bad > 1 ? 'tienen' : 'tiene'} datos faltantes, marcados en rojo.` : ' Revísalos abajo.'}` };
    } else {
      const added = objs.map(o => {
        const r = findPerson(o.responsable);
        const pauta = String(o.pauta || '').split(/[;|\n]/).map(x => x.trim()).filter(Boolean).map(x => P(x));
        const t = newTask({ nombre: o.nombre || '', responsable: r ? r.id : '', monto: money(o.monto) || 0, frecuencia: o.frecuencia || '', siempre: /^(si|sí|s|x|1|true)$/i.test(String(o.siempre || '').trim()), pauta });
        t.historial[0].txt = `Importada desde ${esc(source)}`;
        S.tasks.push(t); return t;
      });
      bad = added.filter(taskIncomplete).length;
      S.importMsg.tareas = { c: bad ? 'warn' : 'ok', html: `Agregamos <b>${added.length} tarea${added.length > 1 ? 's' : ''}</b> desde ${esc(source)}.${bad ? ` ${bad} ${bad > 1 ? 'necesitan' : 'necesita'} datos (por ejemplo, un responsable que no encontramos en tu equipo). Toca «Completar».` : ''}` };
    }
  }

  function assisted(kind, name, reason) {
    S.asistida[kind] = name;
    S.importMsg[kind] = { c: 'info', html: `${reason ? esc(reason) + ' ' : ''}Recibimos <b>${esc(name)}</b>. En el servicio real, el equipo de The Back Office carga estos datos por ti en 1 día hábil. Puedes seguir y completarlos después.` };
  }

  async function handleFile(kind, file) {
    if (!file) return;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    let rows = null, reason = '';
    try {
      if (['csv', 'tsv', 'txt'].includes(ext)) rows = parseTable(await file.text());
      else if (['xlsx', 'xls'].includes(ext)) {
        if (window.XLSX) {
          const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }).map(r => r.map(c => String(c).trim())).filter(r => r.some(Boolean));
        } else reason = 'No pudimos leer el Excel en este momento (se necesita conexión).';
      }
    } catch (err) { rows = null; reason = 'No pudimos leer el archivo.'; }
    if (rows && rows.length) importRows(kind, rows, file.name); else assisted(kind, file.name, reason);
    render();
  }

  function F(path, label, o = {}) {

    const a = `id="${id}" data-f="${path}"${o.req ? ' aria-required="true"' : ''}${err ? ' aria-invalid="true"' : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.im ? ` inputmode="${o.im}"` : ''}${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.re ? ' data-re="1"' : ''}`;
    let ctrl;
    if (o.area) ctrl = `<textarea ${a}>${esc(v)}</textarea>`;
    else if (o.opts) ctrl = `<select ${a}>${o.opts.map(([val, l]) => `<option value="${esc(val)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else ctrl = `<input type="${o.type || 'text'}" ${a} value="${esc(v)}">`;
    return `<div class="field${err ? ' invalid' : ''}"><label for="${id}">${esc(label)}${mark}</label>${ctrl}${err ? `<span class="err">${esc(err)}</span>` : ''}${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}</div>`;
